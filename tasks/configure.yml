---
- name: Validate variables for grafana configure
  ansible.builtin.assert:
    that:
      - grafana_admin_user is defined
      - grafana_admin_user | length > 0
      - grafana_admin_password is defined
      - grafana_admin_password | length > 0
    fail_msg: "grafana_admin_user and grafana_admin_password must be defined and non-empty"

- name: Configure Grafana admin user
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?admin_user'
    line: "admin_user = {{ grafana_admin_user }}"
  notify: Restart grafana-server

- name: Configure Grafana admin password
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?admin_password'
    line: "admin_password = {{ grafana_admin_password }}"
  no_log: true
  notify: Restart grafana-server

- name: Configure Grafana HTTP port
  ansible.builtin.lineinfile:
    path: /etc/grafana/grafana.ini
    regexp: '^;?http_port'
    line: "http_port = {{ grafana_port }}"
  notify: Restart grafana-server
